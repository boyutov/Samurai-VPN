name: Java verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check scripts
        if: runner.os == 'Linux'
        run: |
          for script in *.sh scripts/*.sh native/*/*.sh native/macos/pkg/*; do bash -n "$script"; done
          for script in native/linux/deb/p*; do sh -n "$script"; done
          shellcheck -S error *.sh scripts/*.sh native/*/*.sh native/macos/pkg/* native/linux/deb/p*
      - name: Build and test desktop on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a mvn -B -ntp install -Dsamurai.gui.test=true
      # Throwaway VM: the package installs samurai-vpnd system-wide.
      - name: Install the Debian package and use it without a window
        if: runner.os == 'Linux'
        run: |
          ./package-installer.sh dist/installers
          sudo apt-get update -q
          sudo apt-get install -y ./dist/installers/samurai-vpn_*.deb
          sudo modprobe wireguard
          systemctl is-active samurai-vpnd
          for _ in $(seq 20); do [[ -S /run/samurai-vpnd/daemon.sock ]] && break; sleep 0.5; done
          mvn -B -ntp -o -pl vpn-linux test -Dsamurai.installed.test=true -Dtest=LinuxInstalledServiceTest -Dsurefire.failIfNoSpecifiedTests=false
          # No window: the background agent, a separate process, follows membership changes.
          mvn -B -ntp -o -pl vpn-desktop test -Dsamurai.installed.test=true -Dtest=AgentInstalledTest -Dsurefire.failIfNoSpecifiedTests=false
      - name: Remove the Debian package
        if: runner.os == 'Linux'
        run: |
          ip -o -4 addr | grep -q 'inet 10.203.79.1/' || { echo 'expected a tunnel left by LinuxInstalledServiceTest'; exit 1; }
          sudo apt-get remove -y samurai-vpn
          if ip -o -4 addr | grep -q 'inet 10.203.79.1/'; then echo 'tunnel left behind'; exit 1; fi
          if systemctl is-active --quiet samurai-vpnd; then echo 'service still running'; exit 1; fi
          for path in /opt/samurai-vpn /opt/samurai-vpn-helper /lib/systemd/system/samurai-vpnd.service; do
              [[ ! -e "$path" ]] || { echo "$path left behind"; exit 1; }
          done

      - name: Check PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem *.ps1, native/windows/*.ps1) {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
              if ($errors) { $errors | ForEach-Object { "$($file.Name): $_" }; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Install WireGuard for Windows
        if: runner.os == 'Windows'
        run: choco install wireguard -y --no-progress
      # The runner is a throwaway administrator VM: the system test creates a real tunnel service.
      - name: Build and test on Windows with real WireGuard
        if: runner.os == 'Windows'
        run: mvn -B -ntp install "-Dsamurai.system.test=true"
      - name: Build the Windows setup program, install it and check who may reach the service
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          ./package-installer.ps1 dist\installers
          if ($LASTEXITCODE) { throw 'package-installer.ps1 failed' }
          # Throwaway accounts: the service is installed for samuraiuser; samuraiother must be refused.
          # 14 characters: net user asks an interactive question for longer passwords.
          $plain = 'Sv1!' + [guid]::NewGuid().ToString('N').Substring(0, 10)
          $password = ConvertTo-SecureString $plain -AsPlainText -Force
          foreach ($name in 'samuraiuser', 'samuraiother') { & net.exe user $name $plain /add | Out-Null; if ($LASTEXITCODE) { throw "net user $name failed" } }
          $setup = Get-ChildItem dist\installers\SamuraiVPN-*-setup.exe
          Start-Process -FilePath $setup.FullName -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/ServiceUser=samuraiuser', '/LOG=C:\Users\Public\setup.log'
          if (-not (Test-Path 'C:\ProgramData\SamuraiVPN\run\service.sock')) { Get-Content C:\Users\Public\setup.log -Tail 40; throw 'setup did not start the service' }
          if (-not (Test-Path 'C:\Program Files\SamuraiVPN\SamuraiVPN.exe')) { throw 'application not installed' }
          Copy-Item native\ci\socket-probe.ps1 C:\Users\Public\socket-probe.ps1
          $pwsh = (Get-Command pwsh).Source
          foreach ($name in 'samuraiuser', 'samuraiother') {
              $credential = [pscredential]::new($name, $password)
              $out = "C:\Users\Public\probe-$name.txt"
              Start-Process -FilePath $pwsh -Credential $credential -Wait -WorkingDirectory C:\Users\Public `
                  -ArgumentList '-NoProfile', '-File', 'C:\Users\Public\socket-probe.ps1', '-Out', $out
              "${name}: $(Get-Content -Raw $out)"
          }
          if ((Get-Content -Raw C:\Users\Public\probe-samuraiuser.txt) -notmatch '^connected .*"success":true') { throw 'the installed user cannot use the service' }
          if ((Get-Content -Raw C:\Users\Public\probe-samuraiother.txt) -notmatch '^denied ') { throw 'another account reached the service' }
      - name: Tunnel through the installed service on Windows, then uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mvn -B -ntp -o -pl vpn-windows test "-Dsamurai.installed.test=true" "-Dtest=InstalledServiceTest" "-Dsurefire.failIfNoSpecifiedTests=false"
          if ($LASTEXITCODE) { throw 'InstalledServiceTest failed' }
          # No window: the background agent, a separate process, follows membership changes.
          mvn -B -ntp -o -pl vpn-desktop test "-Dsamurai.installed.test=true" "-Dtest=AgentInstalledTest" "-Dsurefire.failIfNoSpecifiedTests=false"
          if ($LASTEXITCODE) { throw 'AgentInstalledTest failed' }
          if (-not (Get-Service 'WireGuardTunnel$samurai*' -ErrorAction SilentlyContinue)) { throw 'expected a tunnel left for the uninstaller' }
          # The uninstaller relaunches itself from a temporary copy: wait for the folder to disappear.
          Start-Process -FilePath 'C:\Program Files\SamuraiVPN\unins000.exe' -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          for ($i = 0; $i -lt 60 -and (Test-Path 'C:\Program Files\SamuraiVPN'); $i++) { Start-Sleep -Seconds 1 }
          if (Get-ScheduledTask -TaskName 'Samurai VPN Service' -ErrorAction SilentlyContinue) { throw 'scheduled task left behind' }
          if (Get-Service 'WireGuardTunnel$samurai*' -ErrorAction SilentlyContinue) { throw 'tunnel left behind' }
          foreach ($path in 'C:\ProgramData\SamuraiVPN', 'C:\Program Files\SamuraiVPN') { if (Test-Path -LiteralPath $path) { throw "$path left behind" } }
          if (-not (Test-Path 'C:\Program Files\WireGuard\wireguard.exe')) { throw 'WireGuard itself must stay' }

      - name: Install wireguard-go on macOS
        if: runner.os == 'macOS'
        run: |
          brew install wireguard-go wireguard-tools
          for script in native/macos/*.sh; do bash -n "$script"; done
          # Same root-owned copies as native/macos/install-service.sh makes.
          tools="/Library/Application Support/SamuraiVPN/bin"
          sudo mkdir -p "$tools"
          sudo cp "$(readlink -f "$(brew --prefix)/bin/wireguard-go")" "$tools/wireguard-go"
          sudo cp "$(readlink -f "$(brew --prefix)/bin/wg")" "$tools/wg"
          sudo chown -R root:wheel "/Library/Application Support/SamuraiVPN"
          otool -L "$tools/wireguard-go" "$tools/wg"
      - name: Build and test on macOS
        if: runner.os == 'macOS'
        run: mvn -B -ntp install
      # Throwaway VM: the system test needs root for utun, ifconfig and route.
      - name: Test macOS tunnel as root with real wireguard-go
        if: runner.os == 'macOS'
        run: >-
          sudo -E env "PATH=$PATH" mvn -B -ntp -o "-Duser.home=$HOME" -pl vpn-macos test
          -Dsamurai.system.test=true -Dtest=MacSystemTest -Dsurefire.failIfNoSpecifiedTests=false
          && sudo chown -R "$(id -u)" . "$HOME/.m2"
      - name: Build and install the macOS package, use it as ordinary users
        if: runner.os == 'macOS'
        run: |
          ./package-installer.sh dist/installers
          sudo installer -pkg dist/installers/SamuraiVPN-*.pkg -target /
          [[ -d /Applications/SamuraiVPN.app && -S /var/run/samurai-vpnd/daemon.sock ]] || { echo 'package did not install the service'; exit 1; }
          # Throwaway second account; its requests must never reach the runner's tunnel.
          sudo sysadminctl -addUser samuraiother -password "$(uuidgen)"
          id samuraiother
          mvn -B -ntp -o -pl vpn-macos test -Dsamurai.installed.test=true -Dsamurai.other.user=samuraiother \
              -Dtest=MacInstalledServiceTest -Dsurefire.failIfNoSpecifiedTests=false
          # No window: the background agent, a separate process, follows membership changes.
          mvn -B -ntp -o -pl vpn-desktop test -Dsamurai.installed.test=true -Dtest=AgentInstalledTest -Dsurefire.failIfNoSpecifiedTests=false
      - name: Check launchd restarts the service, then uninstall on macOS
        if: runner.os == 'macOS'
        run: |
          java="/Library/Application Support/SamuraiVPN/runtime/bin/java" jar="/Library/Application Support/SamuraiVPN/app/samurai-desktop.jar"
          status() { "$java" -cp "$jar" dev.samurai.vpn.macos.MacClient status "$(uuidgen | tr 'A-Z' 'a-z')"; }
          status
          ifconfig | grep -q 'inet 10.203.79.1' || { echo 'expected a tunnel left by MacInstalledServiceTest'; exit 1; }
          sudo pkill -f dev.samurai.vpn.macos.MacServiceMain
          for _ in $(seq 40); do sleep 1; status 2>/dev/null && break; done
          status
          ifconfig | grep -q 'inet 10.203.79.1' || { echo 'tunnel did not survive the service restart'; exit 1; }
          sudo "/Library/Application Support/SamuraiVPN Setup/uninstall.sh"
          for _ in $(seq 20); do ifconfig | grep -q 'inet 10.203.79.1' || break; sleep 0.5; done
          if ifconfig | grep -q 'inet 10.203.79.1'; then echo 'tunnel left behind'; exit 1; fi
          for path in /Library/LaunchDaemons/dev.samurai.vpn.service.plist "/Library/Application Support/SamuraiVPN" /var/run/samurai-vpnd \
                      /Applications/SamuraiVPN.app "/Library/Application Support/SamuraiVPN Setup"; do
              [[ ! -e "$path" ]] || { echo "$path left behind"; exit 1; }
          done
          if pkgutil --pkgs | grep -qx dev.samurai.vpn; then echo 'package receipt left behind'; exit 1; fi

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: dist/installers/
          if-no-files-found: error
